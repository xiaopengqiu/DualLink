name: Build and publish Windows release

on:
  push:
    branches:
      - 'release-publish-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.5.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify the version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag and package version differ" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "A stable release version is required" }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Windows installer and portable client
        run: npm run package:win
      - name: Package source, web and checksums
        run: npm run release:assets
      - name: Upload, verify and publish all five release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
      - name: Remove local build products after successful publication
        if: success()
        shell: pwsh
        run: |
          Remove-Item release, .local -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item node_modules/electron -Recurse -Force -ErrorAction SilentlyContinue

  publish-existing:
    if: startsWith(github.ref, 'refs/heads/release-publish-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish the existing draft without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^release-publish-', ''
          ./.github/scripts/publish-release.ps1 -Tag $tag -PublishExistingOnly
