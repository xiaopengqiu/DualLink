# Simple personal deployment. For per-job isolation use the host systemd guide.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      CLI_MODE: native
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dual_link_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 20s

volumes:
  dual_link_data:
